<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>配列を画面に表示</title>
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer></script>

</head>
<body>
    <!-- 箱を並べるコンテナ -->
    <div id="grid-container"></div>
    <button id="sort-btn">ソート開始</button>
    <!--<button id="sort">ソート一覧</button>-->
    <form>
        <select name="sort_name" id="sort-select">
            <option value="Insert_sort">挿入ソート</option>
            <option value="Selection_sort">選択ソート</option>
        </select>
    </form>

    <script src="script.js" defer></script>
</body>
</html>
